schema: spec-driven

# Shown to AI when creating artifacts.
context: |
  After a change that touches js/*.js or css/*.css, remind the user which
  Webflow Head/Footer jsDelivr tags need a new SHA after they commit. Do not
  put SHA-pin or publish steps in tasks.md. The user commits and pins.

# Per-artifact rules
rules:
  tasks:
    - Do not add Webflow SHA pin or publish steps. Those are a post-commit reminder, not implementable tasks.

# Advisory guidance for apply and archive
operations:
  apply:
    guidance:
      - When implementation is done, remind the user which Head/Footer tags need a new SHA after they commit.
  archive:
    guidance:
      - If the change touched published JS/CSS, mention the SHA pin reminder in the archive summary. Do not treat a missing pin task as incomplete work.
